<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>vitrine</title>

    <link rel="stylesheet" href="loja.css">

    <style>
        body {
            overflow-y: auto;
        }
    </style>
</head>

<body>

    <!-- Manchas do fundo -->
    <div class="mancha mancha-1"></div>
    <div class="mancha mancha-2"></div>
    <div class="mancha mancha-3"></div>
    <div class="mancha mancha-4"></div>

    <!-- Cabeçalho da loja -->
    <div class="cabecalho-loja">
        <img class="logo-loja" id="logo-loja" src="" alt="">

        <div class="pesquisa-loja">
            <span class="lupa-loja">⌕</span>
            <span class="pesquisa-loja-texto">Pesquisar na loja</span>
        </div>

        <button class="menu-pontinhos-loja" id="menu-pontinhos-loja">⋮</button>
    </div>

    <!-- Menu de lojas (abre ao tocar na logo) -->
    <div class="menu-lojas" id="menu-lojas">
        <div class="lista-lojas" id="lista-lojas"></div>
    </div>

    <!-- Menu de opções (⋮) -->
    <div class="menu-opcoes-loja" id="menu-opcoes-loja">
        <div class="opcao-loja" id="opcao-carrinho">
            <span class="opcao-icone">🛒</span>
            <span>Carrinho</span>
            <span class="carrinho-contador" id="carrinho-contador"></span>
        </div>
    </div>

    <!-- Produtos -->
    <div class="grade-produtos" id="grade-produtos"></div>

    <div class="loja-vazia" id="loja-vazia">
        Essa loja ainda não tem produtos.
    </div>

    <script src="supabase-dados.js"></script>
    <script src="carrinho-dados.js"></script>
    <script src="loja.js"></script>

</body>

</html>
