<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seja parceiro da Vitrine</title>

    <link rel="stylesheet" href="loading.css">

    <style>
        body {
            justify-content: flex-start;
            align-items: flex-start;
            overflow-y: auto;
            height: auto;
            min-height: 100vh;
        }

        .parceiro-pagina {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
            padding: 40px 24px 100px;
            color: #1a1a1a;
            position: relative;
            z-index: 2;
        }

        .parceiro-titulo {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .parceiro-subtitulo {
            font-size: 15px;
            opacity: 0.75;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .parceiro-campo {
            margin-bottom: 20px;
        }

        .parceiro-campo label {
            display: block;
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 8px;
        }

        .parceiro-campo input,
        .parceiro-campo textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid #dcdcdc;
            background: #ffffff;
            color: #1a1a1a;
            font-size: 15px;
            font-family: inherit;
        }

        .parceiro-campo input:focus,
        .parceiro-campo textarea:focus {
            outline: none;
            border-color: #3355b3;
        }

        .parceiro-campo textarea {
            resize: vertical;
            min-height: 90px;
        }

        .parceiro-cor-linha {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .parceiro-cor-linha input[type="color"] {
            width: 52px;
            height: 52px;
            padding: 0;
            border-radius: 14px;
            border: 1px solid #dcdcdc;
            background: #ffffff;
        }

        .parceiro-botao {
            width: 100%;
            padding: 16px;
            margin-top: 8px;

            border: none;
            border-radius: 14px;

            background: #3355b3;
            color: #ffffff;

            font-size: 16px;
            font-weight: 700;
            font-family: inherit;

            cursor: pointer;
            transition: filter 0.2s ease;
        }

        .parceiro-botao:active {
            filter: brightness(0.9);
        }

        .parceiro-botao:disabled {
            opacity: 0.6;
            cursor: default;
        }

        .parceiro-status {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
        }

        .parceiro-status.mostrar {
            display: block;
        }

        .parceiro-status.sucesso {
            color: #7ed957;
        }

        .parceiro-status.erro {
            color: #ff6b6b;
        }
    </style>
</head>

<body>

    <!-- Manchas do fundo -->
    <div class="mancha mancha-1"></div>
    <div class="mancha mancha-2"></div>
    <div class="mancha mancha-3"></div>
    <div class="mancha mancha-4"></div>

    <div class="parceiro-pagina">
        <div class="parceiro-titulo">Seja parceiro da Vitrine</div>
        <div class="parceiro-subtitulo">
            Preencha os dados da sua loja abaixo. A gente confere e,
            assim que aprovado, sua loja aparece pra todo mundo que
            visita a Vitrine.
        </div>

        <form id="form-parceiro">
            <div class="parceiro-campo">
                <label for="campo-nome">Nome da loja</label>
                <input type="text" id="campo-nome" required>
            </div>

            <div class="parceiro-campo">
                <label for="campo-email">E-mail (pra fazer login depois)</label>
                <input type="email" id="campo-email" required>
            </div>

            <div class="parceiro-campo">
                <label for="campo-senha">Senha</label>
                <input type="password" id="campo-senha" required minlength="6">
            </div>

            <div class="parceiro-campo">
                <label for="campo-contato">WhatsApp pra contato</label>
                <input type="text" id="campo-contato" required>
            </div>

            <div class="parceiro-campo">
                <label for="campo-cor">Cor da sua loja</label>
                <div class="parceiro-cor-linha">
                    <input type="color" id="campo-cor" value="#3355b3">
                </div>
            </div>

            <div class="parceiro-campo">
                <label for="campo-mensagem">Conte um pouco sobre sua loja (opcional)</label>
                <textarea id="campo-mensagem"></textarea>
            </div>

            <button type="submit" class="parceiro-botao" id="botao-enviar">
                Enviar cadastro
            </button>

            <div class="parceiro-status" id="status-envio"></div>
        </form>
    </div>


    <!-- Navegação entre a Vitrine e o cadastro de parceiro -->
    <div class="nav-vitrine">
        <a href="index.html" class="nav-vitrine-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Início</span></a>
        <a href="parceiros.html" class="nav-vitrine-item nav-vitrine-ativo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5"></path><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"></path><path d="M9 20v-6h6v6"></path></svg><span>Parceiro</span></a>
        <a href="login.html" class="nav-vitrine-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Minha loja</span></a>
    </div>

    <script src="cadastro-parceiros.js"></script>
</body>

</html>
